<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>MyInv</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- ÉCRAN DE VERROUILLAGE -->
<div id="lockScreen" class="screen">
  <h1>MyInv</h1>
  <input type="password" id="pinInput" maxlength="6" placeholder="Code à 6 caractères">
  <button id="unlockBtn">Déverrouiller</button>
</div>

<!-- APPLICATION -->
<div id="app" class="hidden">
  <nav>
    <button data-page="gold">Or</button>
    <button data-page="silver">Argent</button>
  </nav>

  <!-- OR -->
  <section id="gold" class="page gold">
    <h2>Or</h2>

    <p>Cours (€/oz)</p>
    <input type="number" id="goldRate" placeholder="Auto ou manuel">
    <small id="goldSource"></small>

    <p>Quantité (oz)</p>
    <input type="number" id="goldQty">

    <p>Valeur : <span id="goldValue">0</span> €</p>
    <canvas id="goldChart"></canvas>
  </section>

  <!-- ARGENT -->
  <section id="silver" class="page silver hidden">
    <h2>Argent</h2>

    <p>Cours (€/oz)</p>
    <input type="number" id="silverRate" placeholder="Auto ou manuel">
    <small id="silverSource"></small>

    <p>Quantité (oz)</p>
    <input type="number" id="silverQty">

    <p>Valeur : <span id="silverValue">0</span> €</p>
    <canvas id="silverChart"></canvas>
  </section>
</div>

<script src="auth.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
